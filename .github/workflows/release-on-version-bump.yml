name: Atlas ZIP Release

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: atlas-release
  cancel-in-progress: false

jobs:
  release:
    if: github.repository == 'MagnetOscar/Atlas' && github.ref == 'refs/heads/personal/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: Check accepted source and unused version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 scripts/release-gate.py
          VERSION=$(node -p 'JSON.parse(require("fs").readFileSync("komari-theme.json")).version')
          TAG="atlas-v${VERSION}"
          if git rev-parse "refs/tags/$TAG" >/dev/null 2>&1; then exit 1; fi
          if gh release view "$TAG" >/dev/null 2>&1; then exit 1; fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "TAG=$TAG" >> "$GITHUB_ENV"
          test -f "docs/release-notes-atlas-${VERSION}.md"
      - run: bun install --frozen-lockfile
      - run: bun run lint:check
      - run: bun run test:unit
      - name: Linux helper validation
        run: |
          node --test tests/companion/*.test.cjs tests/full/protocol-management.test.cjs
          python3 tests/companion/test_helper.py
          python3 tests/companion/test_probe_v2.py
          python3 tests/companion/test_cdn.py
          python3 tests/companion/test_archive_safety.py
          python3 tests/feasibility/test_release_scope.py
      - name: Desktop and mobile browser validation
        run: |
          bunx playwright install --with-deps chromium
          bun run test:visual
      - name: Rebuild production ZIP after visual tests
        run: |
          bun run build
          python3 scripts/verify-theme.py komari-theme-Atlas-build-*.zip --release > theme-build-verification.json
          sha256sum komari-theme-Atlas-build-*.zip > SHA256SUMS.txt
          git diff --exit-code
      - name: Publish immutable release and download verification
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git tag -a "$TAG" -m "Atlas release $VERSION"
          git push origin "$TAG"
          FLAGS=()
          if [[ "$VERSION" == *-* ]]; then FLAGS+=(--prerelease); fi
          NOTES="$(mktemp)"
          cat "docs/release-notes-atlas-${VERSION}.md" > "$NOTES"
          {
            printf '\n\n## 下载与校验\n\nSHA256：\n\n```text\n'
            cat SHA256SUMS.txt
            printf '```\n\n[可选回程组件（单独下载）](https://github.com/MagnetOscar/Atlas/releases/tag/atlas-components)\n\n'
            printf '[源码](%s/%s/commit/%s) · [构建验证](%s/%s/actions/runs/%s)\n' "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_SHA" "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID"
          } >> "$NOTES"
          gh release create "$TAG" --verify-tag --title "Atlas v$VERSION" --notes-file "$NOTES" "${FLAGS[@]}" komari-theme-Atlas-build-*.zip
          mkdir -p test-results/release-download
          gh release download "$TAG" --pattern '*.zip' --dir test-results/release-download
          (cd test-results/release-download && sha256sum --check "$GITHUB_WORKSPACE/SHA256SUMS.txt")
      - name: Retain verification results
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: atlas-release-verification-${{ github.sha }}
          path: |
            theme-build-verification.json
            SHA256SUMS.txt
            test-results/
          retention-days: 30
